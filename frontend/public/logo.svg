  <!--
    PLACEHOLDER LOGO — replace this file with your own artwork.

    Two ways to swap it:
      1. Overwrite this file (keeps the path `/logo.svg`, no code change), or
      2. drop your file next to it and point `BRAND.logoSrc` at it in
         src/components/auth/authContent.ts — anything in public/ is served
         from the site root, so public/acme.png -> '/acme.png'.

    It now renders on WHITE tiles (a large plate above the sign-in card, and a
    small tile on the purple hero panel), so a dark or coloured mark reads
    best — which is why this placeholder is purple, not white. Any aspect
    ratio is fine: the call sites use `fill`, so a wide wordmark like this one
    is fitted rather than squashed into a square.
  -->
